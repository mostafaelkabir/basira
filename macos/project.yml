name: Basira
options:
  bundleIdPrefix: com.sysgo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    PRODUCT_NAME: "$(TARGET_NAME)"
targets:
  Basira:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sysgo.Basira
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: BasiraWidget
        embed: true
  BasiraWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sysgo.Basira.Widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/Widget.entitlements
